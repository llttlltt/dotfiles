template-append = """
<conventional-commits>
- Format the subject as `<type>[optional scope][!]: <description>`
- Use exactly one type: `feat`, `fix`, `docs`, `style`, `refactor`, `perf`, `test`, `build`, `ci`, `chore`, or `revert`
- Choose the type that best describes the primary effect of the complete diff
- Use `feat` for a new capability and `fix` for a defect correction
- Use `style` only for formatting changes that do not affect behavior
- Use `refactor` only when behavior is preserved
- Include a short scope only when a single component or area is obvious from the diff
- Write a concise, imperative description without a trailing period
- Add a body only when it provides useful context beyond the subject
- Mark a breaking change with `!` before the colon and, when explanation is needed, add a `BREAKING CHANGE: <details>` footer
- Put issue references in the footer, such as `Refs: #123` or `Closes: #123`, only when they appear in the supplied context
- Never invent a scope, issue reference, breaking change, or implementation detail
</conventional-commits>
