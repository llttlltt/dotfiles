# Sibling worktrees: cantoflip + refactor/effect-rpc -> cantoflip-effect-rpc.
# Use the final branch component; branches with the same suffix share a path.
worktree-path = "{{ repo_path }}/../{{ repo }}-{{ branch | basename | sanitize }}"

# Generate commit messages with a fast, tool-less Claude call.
[commit.generation]
command = "op run --no-masking --env-file=\"$HOME/.config/ai-proxy/claude.env\" -- env MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"
template = """
<task>Write a concise git commit message for the staged changes below.</task>
<format>
- Output only the commit message, with no quotes, labels, or code blocks
- Put the subject on the first line
- The subject must be imperative, at most 72 characters, and have no trailing period
- The body may be empty or contain short bullet points after a blank line
</format>
<style>
- Capture the primary user-visible or developer-visible change
- Describe the change without inventing details not supported by the diff
</style>
{% if user_guidance %}
<user-guidance>
{{ user_guidance }}
</user-guidance>
{% endif %}
{% if project_guidance %}
<project-guidance>
