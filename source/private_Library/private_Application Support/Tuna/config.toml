[settings]
backspaceBehavior = 'deleteCharacters'
comboModeBackspaceBehavior = 'stepBack'
comboModeCheatsheetBehavior = 'always'
comboModeCheatsheetShowDetails = false
switchToTextModeWhenNoResults = true
themeIdentifier = 'com.brnbw.tuna.themes.Notch'
typingTimeoutDuration = 2.5000000000000004

[[smartLinks.entries]]
enabled = true
name = 'Google Maps'
requiresInput = true
template = 'https://www.google.com/maps/search/{{input}}'

[[smartLinks.entries]]
enabled = true
name = 'Google Search'
requiresInput = true
template = 'https://www.google.com/search?q={{input}}'

[[smartLinks.entries]]
enabled = true
name = 'Obsidian - Add to Daily Note'
requiresInput = true
template = 'obsidian://quickadd?vault=Elliott%20Liu&choice=Capture%20-%20Log%20in%20Daily%20Note&value-Note={{input}}'

[[smartLinks.entries]]
enabled = true
name = 'T3 Chat'
requiresInput = true
template = 'https://www.t3.chat/new?q={{input}}'

[[smartLinks.entries]]
enabled = true
name = 'Wikipedia'
requiresInput = true
template = 'https://en.wikipedia.org/wiki/Special:Search?search={{input}}'

[[smartLinks.entries]]
enabled = true
name = 'YouTube'
requiresInput = true
template = 'https://www.youtube.com/results?search_query={{input}}'

[[catalogSettings]]
catalogIdentifier = 'tuna.smart-links'

    [catalogSettings.values]
    UseFavicone = 'true'
