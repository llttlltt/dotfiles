[catalogs]
searchPriorities = []

    [[catalogs.globalScopes]]
    catalogIdentifier = 'obsidian'

        [catalogs.globalScopes.scope]
        itemIDs = []
        kind = 'excluding'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'obsidian.notes'

        [catalogs.globalScopes.scope]
        kind = 'none'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.clipboard'

        [catalogs.globalScopes.scope]
        itemIDs = [ 'clipboard.history.root' ]
        kind = 'excluding'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.commands'

        [catalogs.globalScopes.scope]
        itemIDs = [ 'openDocumentation', 'openSettings', 'sendFeedback', 'showOnboarding' ]
        kind = 'excluding'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.effects'

        [catalogs.globalScopes.scope]
        itemIDs = [ 'Confetti', 'Confetti Rain', 'WASTED' ]
        kind = 'only'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.emoji'

        [catalogs.globalScopes.scope]
        kind = 'none'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.modes'

        [catalogs.globalScopes.scope]
        itemIDs = [ 'combo', 'search', 'talk', 'text' ]
        kind = 'excluding'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.recents'

        [catalogs.globalScopes.scope]
        kind = 'none'

    [[catalogs.globalScopes]]
    catalogIdentifier = 'tuna.windows'

        [catalogs.globalScopes.scope]
        kind = 'none'

    [[catalogs.sortOrders]]
